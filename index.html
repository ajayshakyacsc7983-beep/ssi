
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura AI Studio | The Elite Creative Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --aura-cyan: #22d3ee;
        --aura-indigo: #6366f1;
        --bg-deep: #02040a;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-deep);
        color: #f8fafc;
        overflow-x: hidden;
      }
      .font-space {
        font-family: 'Space Grotesk', sans-serif;
      }
      .glass {
        background: rgba(8, 12, 24, 0.7);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .aura-card {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .aura-card:hover {
        border-color: rgba(34, 211, 238, 0.4);
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
      }
      .gradient-aura {
        background: linear-gradient(135deg, #22d3ee, #6366f1, #d946ef);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .aura-button {
        background: linear-gradient(to right, #0ea5e9, #6366f1);
        box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.4);
        transition: all 0.4s ease;
      }
      .aura-button:hover {
        box-shadow: 0 15px 40px -5px rgba(99, 102, 241, 0.7);
        transform: translateY(-2px);
      }
      .pulse-aura {
        animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.25; }
      }
      /* Loading Spinner for deployment reassurance */
      #root:empty::before {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Explicit module loading to prevent blank pages -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
